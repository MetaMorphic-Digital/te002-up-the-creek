87 -1.5px 1.5px 0px, #878787 -1.5px -1.5px 0px;text-transform:uppercase;font-family:Alaska\"><span style=\"font-family:Alaska\">Pour Black Book Éditions - Au-delà du fleuve</span></h2><p style=\"box-sizing:border-box;user-select:text;text-align:justify;padding-right:10px;font-family:'Palatino Linotype';font-size:14px\"><strong style=\"box-sizing:border-box;user-select:text\"><span style=\"font-family:'Palatino Linotype'\">Directeur de publication</span></strong><span style=\"font-family:'Palatino Linotype'\">\_: David Burckle\_</span></p><p style=\"box-sizing:border-box;user-select:text;margin-bottom:0.75rem;text-align:justify;padding-right:10px;text-indent:0.75rem;font-family:'Palatino Linotype';font-size:14px\"><strong style=\"box-sizing:border-box;user-select:text\"><span style=\"font-family:'Palatino Linotype'\">Traduction\_</span></strong><span style=\"font-family:'Palatino Linotype'\">: Philippe Tessier\_</span></p><p style=\"box-sizing:border-box;user-select:text;margin-bottom:0.75rem;text-align:justify;padding-right:10px;text-indent:0.75rem;font-family:'Palatino Linotype';font-size:14px\"><strong style=\"box-sizing:border-box;user-select:text\"><span style=\"font-family:'Palatino Linotype'\">Relecture\_</span></strong><span style=\"font-family:'Palatino Linotype'\">: Sélène Meynier\_</span></p><p style=\"box-sizing:border-box;user-select:text;margin-bottom:0.75rem;text-align:justify;padding-right:10px;text-indent:0.75rem;font-family:'Palatino Linotype';font-size:14px\"><strong style=\"box-sizing:border-box;user-select:text\"><span style=\"font-family:'Palatino Linotype'\">Remerciements spéciaux</span></strong><span style=\"font-family:'Palatino Linotype'\">\_: Laurent « ZeDiac » Cournault, Ghislain Bonnotte</span></p><p style=\"box-sizing:border-box;user-select:text;margin-bottom:0.75rem;text-align:justify;padding-right:10px;text-indent:0.75rem;font-family:'Palatino Linotype';font-size:14px\"><span style=\"font-family:'Palatino Linotype'\">\_</span></p><h2 s