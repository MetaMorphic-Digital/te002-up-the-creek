px\"><strong style=\"box-sizing:border-box;user-select:text\"><span style=\"font-family:'Palatino Linotype'\">Torg, The Possibility Wars, et tous les personnages, concepts, lieux et créatures uniques sont des marques et/ou des droits d'auteur d'Ulisses Spiele. Tous droits réservés.</span></strong></p><p style=\"box-sizing:border-box;user-select:text;margin-bottom:0.75rem;text-align:justify;padding-right:10px;text-indent:0.75rem;font-family:'Palatino Linotype';font-size:14px\"><strong style=\"box-sizing:border-box;user-select:text\"><span style=\"font-family:'Palatino Linotype'\">.</span></strong></p>"
